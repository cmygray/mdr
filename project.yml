name: mdr
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MdrKit:
    path: .
targets:
  mdr:
    type: application
    platform: macOS
    sources:
      - App/macOS
    dependencies:
      - package: MdrKit
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleName: mdr
        CFBundleDisplayName: mdr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        # mdr serve는 tailnet IP(100.64.0.0/10, fd7a:115c:a1e0::/48)에 http로 내줍니다. 회선은 WireGuard가 암호화합니다.
        # NSAllowsLocalNetworking은 tailnet 범위를 로컬로 보지 않아 -1022로 막힙니다(2026-11-23 다른 Mac에서 확인).
        # 앱은 요청 전에 host가 tailnet 범위인지 검사하고(RemoteLocation), 웹 링크는 브라우저로 넘깁니다.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        MDRDevTokensPath: $(MDR_DEV_TOKENS_PATH)
        CFBundleURLTypes:
          - CFBundleURLName: kim.two.mdr.remote-document
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [mdr]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Document
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kim.two.mdr
        PRODUCT_NAME: mdr
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          MDR_DEV_TOKENS_PATH: $(SRCROOT)/Sources/MdrKit/Resources/tokens.json
        Release:
          MDR_DEV_TOKENS_PATH: ""
